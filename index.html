<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>嗅嗅</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fafaf8;
      color: #333;
      font-family: 'Noto Serif TC', serif;
      line-height: 1.8;
    }

    /* Hero */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 90px 20px 60px;
    }

    .portrait {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 36px;
      filter: grayscale(8%);
    }

    .name {
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: 0.5em;
      color: #2a2a2a;
      margin-bottom: 10px;
    }

    .breed {
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      color: #aaa;
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 300;
    }

    /* Divider */
    .divider {
      width: 36px;
      height: 1px;
      background: #ddd;
      margin: 55px auto;
    }

    /* Info */
    .info {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 30px;
    }

    .info-row {
      display: flex;
      align-items: baseline;
      gap: 24px;
      padding: 16px 0;
      border-bottom: 1px solid #efefef;
    }

    .info-label {
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      color: #bbb;
      font-family: 'Noto Sans TC', sans-serif;
      min-width: 60px;
    }

    .info-value {
      font-size: 0.92rem;
      color: #555;
      font-weight: 300;
    }

    /* About */
    .about {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 30px;
    }

    .section-title {
      font-size: 0.68rem;
      letter-spacing: 0.35em;
      color: #ccc;
      font-family: 'Noto Sans TC', sans-serif;
      margin-bottom: 22px;
      text-transform: uppercase;
    }

    .about-text {
      font-size: 0.93rem;
      color: #666;
      font-weight: 300;
      line-height: 2.4;
    }

    /* Gallery */
    .gallery {
      max-width: 840px;
      margin: 0 auto 90px;
      padding: 0 20px;
    }

    .gallery .section-title {
      text-align: center;
      margin-bottom: 28px;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .photo-grid img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      filter: grayscale(6%);
      transition: filter 0.4s ease, transform 0.4s ease;
      cursor: pointer;
    }

    .photo-grid img:hover {
      filter: grayscale(0%);
      transform: scale(1.03);
    }

    /* Videos */
    .videos {
      max-width: 840px;
      margin: 0 auto 90px;
      padding: 0 20px;
    }

    .videos .section-title {
      text-align: center;
      margin-bottom: 28px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .video-grid video {
      width: 100%;
      aspect-ratio: 9/16;
      object-fit: cover;
      background: #f0f0ee;
    }

    /* BGM button */
    #bgm-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid #ddd;
      background: #fafaf8;
      color: #aaa;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 100;
    }

    #bgm-btn:hover {
      border-color: #bbb;
      color: #777;
    }

    #bgm-btn.playing {
      border-color: #b5c4b1;
      color: #7a9e76;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 28px;
      font-size: 0.72rem;
      color: #ccc;
      letter-spacing: 0.15em;
      font-family: 'Noto Sans TC', sans-serif;
    }
  </style>
</head>
<body>

  <section class="hero">
    <img class="portrait" src="images/portrait.png" alt="嗅嗅">
    <h1 class="name">嗅 嗅</h1>
    <p class="breed">Maltese · 馬爾濟斯</p>
  </section>

  <div class="divider"></div>

  <section class="info">
    <div class="info-row">
      <span class="info-label">生日</span>
      <span class="info-value">2022 年 7 月 24 日</span>
    </div>
    <div class="info-row">
      <span class="info-label">性格</span>
      <span class="info-value">INFP</span>
    </div>
    <div class="info-row">
      <span class="info-label">喜好</span>
      <span class="info-value">喜歡人 ＞ 狗 · 出去玩 · 跟人貼貼</span>
    </div>
  </section>

  <div class="divider"></div>

  <section class="about">
    <p class="section-title">關於嗅嗅</p>
    <p class="about-text">
      有自己的小世界，常常把髒話掛在嘴邊，<br>
      但絕對沒有生氣的意思。<br><br>
      就是這樣一隻，讓人忍不住想要一直抱著的小狗。
    </p>
  </section>

  <div class="divider"></div>

  <section class="gallery">
    <p class="section-title">Gallery</p>
    <div class="photo-grid">
      <img src="images/IMG_6728.JPG" alt="嗅嗅">
      <img src="images/IMG_6748.JPG" alt="嗅嗅">
      <img src="images/IMG_6761.JPG" alt="嗅嗅">
      <img src="images/IMG_6773.JPG" alt="嗅嗅">
      <img src="images/IMG_6793.JPG" alt="嗅嗅">
      <img src="images/IMG_6803.JPG" alt="嗅嗅">
      <img src="images/IMG_6931.JPG" alt="嗅嗅">
      <img src="images/IMG_7173.JPG" alt="嗅嗅">
      <img src="images/IMG_8153.JPG" alt="嗅嗅">
    </div>
  </section>

  <section class="videos">
    <p class="section-title">Videos</p>
    <div class="video-grid">
      <video src="images/video1.mp4" controls playsinline loop></video>
      <video src="images/video2.mp4" controls playsinline loop></video>
    </div>
  </section>

  <!-- 背景音樂 -->
  <audio id="bgm" src="images/bgm.mp3" loop preload="auto"></audio>

  <!-- 音樂控制按鈕 -->
  <button id="bgm-btn" onclick="toggleBGM()" title="背景音樂">♪</button>

  <footer>
    © 嗅嗅 · est. 2022
  </footer>

  <script>
    const audio = document.getElementById('bgm');
    const btn = document.getElementById('bgm-btn');
    let started = false;

    // 第一次點擊頁面任何地方就開始播放
    document.addEventListener('click', function startOnFirstClick() {
      if (!started) {
        audio.play();
        btn.classList.add('playing');
        btn.title = '暫停音樂';
        started = true;
      }
      document.removeEventListener('click', startOnFirstClick);
    }, { once: true });

    function toggleBGM() {
      if (audio.paused) {
        audio.play();
        btn.classList.add('playing');
        btn.title = '暫停音樂';
        started = true;
      } else {
        audio.pause();
        btn.classList.remove('playing');
        btn.title = '播放音樂';
      }
    }
  </script>
</body>
</html>
